<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini-Quark</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#1c1c1c;--rail:#171717;--pill:#2b2b2b;--line:#343434;--txt:#ececec;--mut:#8e8e8e;--acc:#0a84d6;--hov:#2a2a2a;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#fff;--rail:#f4f4f4;--pill:#f1f1f1;--line:#e3e3e3;--txt:#1b1b1b;--mut:#777;--hov:#e8e8e8;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--txt);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rail{width:52px;background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
.rail button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center}
.rail button:hover,.rail .on{background:var(--hov)}
.rail .sp{flex:1}
.side{width:0;overflow:hidden;background:var(--rail);border-right:1px solid var(--line);transition:width .2s}
.side.open{width:260px}
.side>div{width:260px;height:100%;display:flex;flex-direction:column;padding:12px 10px;gap:8px}
input,textarea{font:inherit}
.side input{background:var(--pill);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px}
.chats{overflow:auto;display:flex;flex-direction:column;gap:2px}
.ci{display:flex;align-items:center;border-radius:9px;padding:0 4px 0 10px}
.ci:hover,.ci.on{background:var(--hov)}
.ci .t{flex:1;min-width:0;text-align:left;padding:8px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .x{opacity:0;width:28px;height:28px;display:grid;place-items:center;color:var(--mut)}
.ci:hover .x,.ci .x:focus-visible{opacity:1}
main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.seg{position:absolute;top:6px;left:50%;transform:translateX(-50%);display:flex;background:var(--pill);border-radius:999px;z-index:2}
.seg button{padding:6px 26px;border-radius:999px;color:var(--mut);font-size:14px}
.seg .on{background:var(--hov);color:var(--txt);box-shadow:0 0 0 1px var(--line)}
#log{flex:1;overflow:auto;padding:64px 20px 8px}
.col{max-width:760px;margin:0 auto}
.u{display:flex;justify-content:flex-end;margin:18px 0}
.u div{background:var(--pill);padding:9px 16px;border-radius:20px;max-width:80%;white-space:pre-wrap;word-break:break-word}
.a{margin:18px 0}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md pre{background:#101010;color:#e6e6e6;padding:12px 14px;border-radius:10px;overflow:auto;font-size:13px}
.md code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.md :not(pre)>code{background:var(--pill);padding:1px 6px;border-radius:6px}
.md table{border-collapse:collapse;display:block;overflow:auto}.md td,.md th{border:1px solid var(--line);padding:5px 10px}
.md a{color:var(--acc)}.md blockquote{margin:0;padding-left:14px;border-left:3px solid var(--line);color:var(--mut)}
.step{color:var(--mut);font-size:13px;margin:6px 0}
.err{color:#e5736b;font-size:14px;margin:8px 0}
.cf{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--rail)}
.cf pre{margin:8px 0;white-space:pre-wrap;word-break:break-all;font-size:13px;color:var(--mut);max-height:160px;overflow:auto}
.cf button{border:1px solid var(--line);border-radius:999px;padding:4px 14px;margin-right:6px}
.cf .go{background:var(--txt);color:var(--bg)}
.th{margin:8px 0}
.th-h{display:flex;align-items:center;gap:6px;color:var(--mut);text-align:left;max-width:100%}
.th-h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-h svg{width:16px;height:16px;transition:transform .15s}
.th.open .th-h svg{transform:rotate(180deg)}
.th-b{display:none;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:8px}
.th.open .th-b{display:block}
.th-b small{display:block;color:var(--mut);margin-bottom:6px}
.th-b p{margin:6px 0}
.live .th-h span{animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.4}}
@media(prefers-reduced-motion:reduce){.live .th-h span{animation:none}.side{transition:none}}
.dock{width:100%;padding:8px 20px 18px}
.dock>*{max-width:770px;margin-left:auto;margin-right:auto}
.greet,.sugg{display:none}
.empty #log{display:none}
.empty .dock{margin:auto 0;padding-bottom:12vh}
.empty .greet{display:block;text-align:center;font-size:26px;margin-bottom:26px}
.empty .sugg{display:flex;flex-direction:column;margin-top:18px}
.comp{display:flex;align-items:flex-end;gap:4px;background:var(--pill);border-radius:26px;padding:8px 10px}
.comp textarea{flex:1;background:none;border:0;outline:0;resize:none;color:var(--txt);padding:8px 4px;max-height:200px}
.comp textarea::placeholder{color:var(--mut)}
.ib,.chip,.send{height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px}
.ib{width:36px;color:var(--mut)}.ib:hover{background:var(--hov)}
.chip{padding:0 10px;color:var(--mut)}.chip.on{color:var(--acc)}
.send{width:36px;background:var(--acc);color:#fff}.send:disabled{opacity:.4;cursor:default}
.atts{display:flex;gap:6px;flex-wrap:wrap}.atts:not(:empty){margin-bottom:6px}
.atts span{background:var(--pill);border-radius:8px;padding:2px 8px;font-size:13px}
.sugg button{display:flex;align-items:center;gap:14px;padding:12px 14px;color:var(--mut);border-radius:10px;text-align:left}
.sugg button:hover{background:var(--hov);color:var(--txt)}
dialog{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:#0008}
dialog label{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
dialog input{width:100%;background:var(--pill);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px}
dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
dialog .row button{border:1px solid var(--line);border-radius:999px;padding:6px 16px}
@media(max-width:640px){.rail{width:44px}.seg button{padding:6px 16px}.side.open{position:absolute;z-index:5;height:100%;left:44px}}
</style>
</head>
<body class="empty">
<nav class="rail">
  <span style="height:36px;display:grid;place-items:center" data-i="atom"></span>
  <button id="bNew" title="Nova conversa" aria-label="Nova conversa" data-i="pen"></button>
  <button id="bSearch" title="Buscar conversas" aria-label="Buscar conversas" data-i="search"></button>
  <button id="bChats" title="Conversas" aria-label="Conversas" data-i="chat"></button>
  <div class="sp"></div>
  <button id="bSet" title="Configurações" aria-label="Configurações" data-i="sliders"></button>
</nav>
<aside class="side" id="side"><div><input id="q" placeholder="Buscar conversas"><div class="chats" id="chats"></div></div></aside>
<main>
  <div class="seg" title="Chat: só memória. Work: terminal, código e ferramentas (pede confirmação)."><button id="mChat" class="on">Chat</button><button id="mWork">✦ Work</button></div>
  <div id="log"><div class="col" id="msgs"></div></div>
  <div class="dock">
    <div class="greet">O que você tem em mente hoje?</div>
    <div class="atts" id="atts"></div>
    <div class="comp">
      <button class="ib" id="bAtt" title="Anexar arquivo de texto" aria-label="Anexar arquivo" data-i="plus"></button>
      <textarea id="in" rows="1" placeholder="Pergunte ao Mini-Quark"></textarea>
      <button class="chip" id="bThink" title="Pedir raciocínio ao modelo" data-i="half"> Pensar</button>
      <button class="send" id="bSend" title="Enviar" aria-label="Enviar" data-i="up"></button>
    </div>
    <div class="sugg" id="sugg"></div>
  </div>
  <input type="file" id="file" multiple hidden>
</main>
<dialog id="dlg">
  <strong>Configurações</strong>
  <label for="model">Modelo (OpenRouter)</label><input id="model" autocomplete="off">
  <label for="key">Chave da API <span id="keyOk"></span></label><input id="key" type="password" autocomplete="off" placeholder="sk-or-...">
  <div class="row"><button id="dCancel">Cancelar</button><button id="dSave" style="background:var(--txt);color:var(--bg)">Salvar</button></div>
</dialog>
<script>
const TOKEN="__TOKEN__",$=s=>document.querySelector(s);
const P={pen:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',chat:'<path d="M21 12a8 8 0 01-11.6 7.1L3 21l1.9-5.4A8 8 0 1121 12z"/>',sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',plus:'<path d="M12 5v14M5 12h14"/>',up:'<path d="M12 19V5M5 12l7-7 7 7"/>',stop:'<rect x="7" y="7" width="10" height="10" rx="2"/>',chev:'<path d="M6 9l6 6 6-6"/>',half:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',term:'<path d="M4 17l6-6-6-6M12 19h8"/>',graph:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8 7l8 1M7 8l2 8M17 10l-6 6"/>',atom:'<circle cx="12" cy="12" r="1.8"/><ellipse cx="12" cy="12" rx="10" ry="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(120 12 12)"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
document.querySelectorAll("[data-i]").forEach(e=>e.insertAdjacentHTML("afterbegin",ico(e.dataset.i)));
const H={"X-Token":TOKEN,"Content-Type":"application/json"};
const api=(p,b)=>fetch("/api/"+p,{method:b?"POST":"GET",headers:H,body:b?JSON.stringify(b):undefined}).then(r=>r.json());
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const md=t=>window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(t,{breaks:true})):`<p>${esc(t).replace(/\n/g,"<br>")}</p>`;
let S={chats:[],active:null},work=false,think=false,busy=false,ctl=null,atts=[];
const msgs=$("#msgs"),log=$("#log"),ta=$("#in");

function setEmpty(){document.body.classList.toggle("empty",!msgs.children.length)}
function addUser(t){const d=document.createElement("div");d.className="u";d.append(document.createElement("div"));d.firstChild.textContent=t;msgs.append(d)}
function addAsst(t){const d=document.createElement("div");d.className="a";if(t!=null){const m=document.createElement("div");m.className="md";m.innerHTML=md(t);d.append(m)}msgs.append(d);return d}
function load(s){S=s;msgs.innerHTML="";s.history.forEach(m=>m.role==="user"?addUser(m.content):addAsst(m.content));setEmpty();renderChats();log.scrollTop=log.scrollHeight}
function renderChats(){
  const f=$("#q").value.toLowerCase(),box=$("#chats");box.innerHTML="";
  S.chats.filter(c=>c.title.toLowerCase().includes(f)).forEach(c=>{
    const r=document.createElement("div");r.className="ci"+(c.id===S.active?" on":"");
    r.innerHTML='<button class="t"></button><button class="x" title="Apagar" aria-label="Apagar conversa"></button>';
    const t=r.querySelector(".t"),x=r.querySelector(".x");t.textContent=c.title;x.innerHTML=ico("trash");
    t.onclick=async()=>{if(!busy)load(await api("chat/switch",{id:c.id}))};
    x.onclick=async()=>{if(!busy)load(await api("chat/delete",{id:c.id}))};
    box.append(r)})}
function setWork(v){work=v;$("#mWork").classList.toggle("on",v);$("#mChat").classList.toggle("on",!v)}
function grow(){ta.style.height="auto";ta.style.height=Math.min(ta.scrollHeight,200)+"px"}
function renderAtts(){$("#atts").innerHTML="";atts.forEach(a=>{const s=document.createElement("span");s.textContent="📎 "+a.name;$("#atts").append(s)})}

function mkThink(a){const d=document.createElement("div");d.className="th open live";
  d.innerHTML='<button class="th-h"><span>Pensando…</span>'+ico("chev")+'</button><div class="th-b"><small>Pensando…</small><div></div></div>';
  d.querySelector(".th-h").onclick=()=>d.classList.toggle("open");a.append(d);return d}
function noteEl(a,cls,t){const d=document.createElement("div");d.className=cls;d.textContent=t;a.append(d)}

async function send(){
  if(busy){ctl&&ctl.abort();return}
  const text=ta.value.trim();if(!text&&!atts.length)return;
  let full=text;atts.forEach(a=>full+=`\n\n--- [Arquivo: ${a.name}] ---\n${a.text}`);
  ta.value="";grow();atts=[];renderAtts();
  addUser(text||"(arquivos anexados)");setEmpty();
  const a=addAsst();let seg=null,segT="",th=null,thT="",raf=0;
  busy=true;ctl=new AbortController();$("#bSend").innerHTML=ico("stop");
  const flush=()=>{raf=0;const st=log.scrollHeight-log.scrollTop-log.clientHeight<90;
    if(seg)seg.innerHTML=md(segT);
    if(th){const L=thT.split("\n").map(s=>s.replace(/\*\*/g,"").trim()).filter(Boolean);
      th.querySelector(".th-h span").textContent=(L[L.length-1]||"Pensando…").slice(0,110);
      th.querySelector(".th-b div").innerHTML=L.map(l=>`<p>${esc(l)}</p>`).join("")}
    if(st)log.scrollTop=log.scrollHeight};
  const sched=()=>raf||(raf=requestAnimationFrame(flush));
  const newSeg=()=>{seg=document.createElement("div");seg.className="md";a.append(seg);segT=""};
  const ev=m=>{switch(m.t){
    case"seg":newSeg();break;
    case"text":if(!seg)newSeg();segT+=m.d;sched();break;
    case"think_start":th=mkThink(a);thT="";break;
    case"think":if(!th){th=mkThink(a);thT=""}thT+=m.d;sched();break;
    case"think_end":if(th){th.classList.remove("live","open");th.querySelector("small").textContent="Pensou por "+m.d+"s";flush();th=null}break;
    case"step":seg=null;noteEl(a,"step","⚙ "+m.d);break;
    case"confirm":seg=null;confirmCard(a,m);break;
    case"log":noteEl(a,/erro|⚠|falh/i.test(m.d)?"err":"step",m.d);break;
    case"error":noteEl(a,"err",m.d);break}
    sched()};
  try{
    const r=await fetch("/api/send",{method:"POST",signal:ctl.signal,headers:H,body:JSON.stringify({chat:S.active,text:full,mode:work?"work":"chat",think})});
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n\n"))>=0){const l=buf.slice(0,i);buf=buf.slice(i+2);if(l.startsWith("data: "))ev(JSON.parse(l.slice(6)))}}
  }catch(e){if(e.name!=="AbortError")noteEl(a,"err","Falha na conexão: "+e.message)}
  flush();document.querySelectorAll(".th.live").forEach(t=>t.classList.remove("live"));
  busy=false;ctl=null;$("#bSend").innerHTML=ico("up");
  S=await api("state");renderChats();
}
function confirmCard(a,m){
  const c=document.createElement("div");c.className="cf";
  c.innerHTML='<div></div><pre></pre><button class="go">Permitir</button><button>Negar</button><button>Sempre nesta sessão</button>';
  c.firstChild.textContent="O modelo quer: "+m.kind;c.querySelector("pre").textContent=m.detail;
  const b=c.querySelectorAll("button"),done=(ok,always)=>{api("confirm",{id:m.id,ok,always});c.querySelectorAll("button").forEach(x=>x.disabled=true);c.append(" "+(ok?"permitido":"negado"))};
  b[0].onclick=()=>done(true);b[1].onclick=()=>done(false);b[2].onclick=()=>done(true,true);a.append(c)}

$("#bSend").onclick=send;
ta.addEventListener("input",grow);
ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
$("#mChat").onclick=()=>setWork(false);$("#mWork").onclick=()=>setWork(true);
$("#bThink").onclick=e=>{think=!think;e.currentTarget.classList.toggle("on",think)};
$("#bNew").onclick=async()=>{if(!busy){load(await api("chat/new",{}));ta.focus()}};
$("#bChats").onclick=()=>$("#side").classList.toggle("open");
$("#bSearch").onclick=()=>{$("#side").classList.add("open");$("#q").focus()};
$("#q").oninput=renderChats;
$("#bAtt").onclick=()=>$("#file").click();
$("#file").onchange=async e=>{for(const f of e.target.files)atts.push({name:f.name,text:await f.text()});e.target.value="";renderAtts()};
const dlg=$("#dlg");
$("#bSet").onclick=()=>{$("#model").value=S.model||"";$("#key").value="";$("#keyOk").textContent=S.hasKey?"(definida ✓)":"(não definida)";dlg.showModal()};
$("#dCancel").onclick=()=>dlg.close();
$("#dSave").onclick=async()=>{S=await api("config",{model:$("#model").value,key:$("#key").value});dlg.close()};
[["pen","Escreva ou edite",()=>{ta.value="Escreva ";}],["term","Execute um comando",()=>{setWork(true);ta.value="Execute o comando: "}],["graph","Consulte a memória",()=>{ta.value="O que você tem guardado na sua memória sobre mim?"}]].forEach(([i,t,f])=>{
  const b=document.createElement("button");b.innerHTML=ico(i)+"<span>"+t+"</span>";b.onclick=()=>{f();grow();ta.focus()};$("#sugg").append(b)});
api("state").then(s=>{load(s);if(!s.hasKey)$("#bSet").click();ta.focus()});
</script>
</body>
</html>
